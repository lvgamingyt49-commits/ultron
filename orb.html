<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRON</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; cursor: grab; color: #ccc; }
body:active { cursor: grabbing; }
canvas { display: block; }

.hud { position: fixed; pointer-events: none; z-index: 10; }
.hud-btn { pointer-events: auto; cursor: pointer; }

.hud-title {
  top: 25px; left: 50%; transform: translateX(-50%);
  font-size: 24px; letter-spacing: 14px;
  color: var(--accent, #ff8833);
  text-shadow: 0 0 30px rgba(255,136,51,0.4), 0 0 60px rgba(255,136,51,0.2);
  font-weight: bold;
}

.hud-hint {
  bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 10px; color: #553322; letter-spacing: 2px;
  text-align: center; line-height: 2;
}
.hud-hint .key { color: #884422; border: 1px solid #331a0a; padding: 2px 6px; margin: 0 3px; font-size: 9px; }

.controls-panel {
  position: fixed; top: 70px; right: 20px; z-index: 20;
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.controls-panel button {
  pointer-events: auto;
  background: rgba(0,0,0,0.6); border: 1px solid #331a0a;
  color: #884422; font-family: inherit; font-size: 10px;
  padding: 6px 12px; letter-spacing: 2px; cursor: pointer;
  transition: all 0.2s; text-align: left;
}
.controls-panel button:hover { border-color: var(--accent, #ff8833); color: var(--accent, #ff8833); }
.controls-panel button.active { border-color: var(--accent, #ff8833); color: var(--accent, #ff8833); background: rgba(255,136,51,0.1); }

.color-panel {
  position: fixed; top: 70px; left: 20px; z-index: 20;
  display: flex; flex-direction: column; gap: 4px;
}
.color-dot {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: border-color 0.2s;
  pointer-events: auto;
}
.color-dot:hover { border-color: #fff; }
.color-dot.active { border-color: #fff; }

.chat-panel {
  position: fixed; bottom: 80px; right: 20px; z-index: 20;
  width: 280px; background: rgba(0,0,0,0.85);
  border: 1px solid #1a0a0a; pointer-events: auto;
  display: none; flex-direction: column;
}
.chat-panel.open { display: flex; }
.chat-header {
  padding: 8px 12px; border-bottom: 1px solid #1a0a0a;
  font-size: 10px; letter-spacing: 3px; color: #553322;
  display: flex; justify-content: space-between;
}
.chat-header button { background: none; border: none; color: #553322; cursor: pointer; font-family: inherit; }
.chat-msgs {
  height: 180px; overflow-y: auto; padding: 8px;
  font-size: 10px; line-height: 1.6;
}
.chat-msgs .m { margin-bottom: 4px; }
.chat-msgs .u { color: #ddaa77; }
.chat-msgs .a { color: #88bbaa; }
.chat-input-row {
  display: flex; border-top: 1px solid #1a0a0a;
}
.chat-input-row input {
  flex: 1; background: transparent; border: none;
  padding: 8px; color: #ccc; font-family: inherit; font-size: 10px; outline: none;
}
.chat-input-row button {
  background: transparent; border: none; border-left: 1px solid #1a0a0a;
  color: #553322; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 10px;
}

.scanline {
  position: fixed; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to bottom, transparent, rgba(255,136,51,0.03), transparent);
  animation: scan 4s linear infinite; pointer-events: none; z-index: 30;
}
@keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(100vh); } }

.camera-preview {
  position: fixed; bottom: 80px; left: 20px; z-index: 20;
  width: 160px; height: 120px; border: 1px solid #1a0a0a;
  display: none; overflow: hidden;
}
.camera-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.camera-preview canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.camera-preview .cam-status {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  font-size: 8px; color: #553322; letter-spacing: 1px; white-space: nowrap;
}

@media (max-width: 600px) {
  .hud-title { font-size: 16px; letter-spacing: 8px; }
  .chat-panel { width: 220px; right: 10px; }
  .controls-panel { right: 10px; top: 60px; }
  .controls-panel button { font-size: 8px; padding: 4px 8px; }
}
</style>
</head>
<body>
<div class="hud hud-title" id="orbTitle">U.L.T.R.O.N.</div>
<div class="hud hud-hint" id="orbHint">
  <span class="key">DRAG</span> spin &nbsp; <span class="key">SCROLL</span> zoom
  &nbsp; <span class="key">G</span> gestures
</div>
<div class="scanline"></div>

<div class="color-panel" id="colorPanel">
  <div class="color-dot active" data-color="#ff8833" style="background:#ff8833" title="Amber"></div>
  <div class="color-dot" data-color="#33aaff" style="background:#33aaff" title="Blue"></div>
  <div class="color-dot" data-color="#33ff88" style="background:#33ff88" title="Green"></div>
  <div class="color-dot" data-color="#ff33aa" style="background:#ff33aa" title="Pink"></div>
  <div class="color-dot" data-color="#aa33ff" style="background:#aa33ff" title="Purple"></div>
</div>

<div class="controls-panel">
  <button onclick="toggleChat()">CHAT</button>
  <button onclick="toggleCamera()" id="camBtn">CAMERA</button>
  <button onclick="resetView()">RESET</button>
  <button onclick="toggleFullscreen()">FULL</button>
</div>

<div class="camera-preview" id="cameraPreview">
  <video id="webcam" muted playsinline></video>
  <canvas id="overlay" width="208" height="156"></canvas>
  <div class="cam-status" id="camStatus">CAMERA OFF</div>
</div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <span>ULTRON INTERFACE</span>
    <button onclick="toggleChat()">X</button>
  </div>
  <div class="chat-msgs" id="chatMsgs">
    <div class="m a">ULTRON online. Ask me anything.</div>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">SEND</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm/vision_bundle.js" crossorigin="anonymous"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

let accentColor = '#ff8833';
let accentHex = 0xffaa30;
let accentMid = 0xdd7700;
let accentDim = 0x884400;
let accentFaint = 0x553300;
let accentHot = 0xffcc66;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 0.5, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.prepend(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.4, 0.2);
composer.addPass(bloom);

const chromaticPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uIntensity: { value: 0.003 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uIntensity;
    varying vec2 vUv;
    void main() {
      vec2 dir = vUv - vec2(0.5); float d = length(dir); float offset = uIntensity * d;
      float flicker = 1.0 + 0.02 * sin(uTime * 30.0) * sin(uTime * 7.3);
      vec4 cr = texture2D(tDiffuse, vUv + dir * offset);
      vec4 cg = texture2D(tDiffuse, vUv);
      vec4 cb = texture2D(tDiffuse, vUv - dir * offset * 0.5);
      gl_FragColor = vec4(cr.r, cg.g * 1.05, cb.b * 0.6, 1.0) * flicker;
      gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * vec3(1.15, 0.85, 0.55), 0.3);
    }`
});
composer.addPass(chromaticPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.minDistance = 0.6;
controls.maxDistance = 40;
controls.enablePan = false;
window._controls = controls;
window._camera = camera;

function updateColors(hexStr) {
  const h = parseInt(hexStr.slice(1), 16);
  const r = (h >> 16) & 0xff, g = (h >> 8) & 0xff, b = h & 0xff;
  const bright = Math.min(255, r + 40) << 16 | Math.min(255, g + 20) << 8 | Math.min(255, b + 10);
  const mid = Math.max(0, r - 30) << 16 | Math.max(0, g - 30) << 8 | Math.max(0, b - 20);
  const dim = Math.max(0, r - 80) << 16 | Math.max(0, g - 80) << 8 | Math.max(0, b - 70);
  const faint = Math.max(0, r - 140) << 16 | Math.max(0, g - 130) << 8 | Math.max(0, b - 120);
  const hot = Math.min(255, r + 60) << 16 | Math.min(255, g + 40) << 8 | Math.min(255, b + 20);
  accentHex = bright; accentMid = mid; accentDim = dim; accentFaint = faint; accentHot = hot;
  document.documentElement.style.setProperty('--accent', hexStr);
  recolorScene();
}

function recolorScene() {
  orbGroup.children.forEach(child => {
    if (child.type === 'Group') traverseRecolor(child);
  });
}

function traverseRecolor(obj) {
  obj.children.forEach(child => {
    if (child.isLine || child.isLineSegments) {
      if (child.material && child.material.color) {
        const c = child.material.color.getHex();
        if (c === 0xffaa30) child.material.color.setHex(accentHex);
        else if (c === 0xdd7700) child.material.color.setHex(accentMid);
        else if (c === 0x884400) child.material.color.setHex(accentDim);
        else if (c === 0x553300) child.material.color.setHex(accentFaint);
        else if (c === 0xffcc66) child.material.color.setHex(accentHot);
      }
    }
    if (child.type === 'Group') traverseRecolor(child);
  });
}

const orbGroup = new THREE.Group();
scene.add(orbGroup);

function lineMat(color, opacity = 1) {
  return new THREE.LineBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
}

function latRing(radius, lat, segs = 120) {
  const r = radius * Math.cos(lat), y = radius * Math.sin(lat);
  const pts = [];
  for (let i = 0; i <= segs; i++) { const a = (i / segs) * Math.PI * 2; pts.push(new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a))); }
  return new THREE.BufferGeometry().setFromPoints(pts);
}

function meridian(radius, lon, segs = 120) {
  const pts = [];
  for (let i = 0; i <= segs; i++) { const lat = (i / segs) * Math.PI - Math.PI / 2; pts.push(new THREE.Vector3(radius * Math.cos(lat) * Math.cos(lon), radius * Math.sin(lat), radius * Math.cos(lat) * Math.sin(lon))); }
  return new THREE.BufferGeometry().setFromPoints(pts);
}

// Build orb scene
const outerShell = new THREE.Group();
const R1 = 2.0;
for (let i = -15; i <= 15; i++) { const lat = (i / 15) * (Math.PI / 2) * 0.95; outerShell.add(new THREE.Line(latRing(R1, lat), lineMat(i % 3 === 0 ? 0xdd7700 : 0x553300, i % 3 === 0 ? 0.5 : 0.12))); }
for (let i = 0; i < 24; i++) { const lon = (i / 24) * Math.PI * 2; outerShell.add(new THREE.Line(meridian(R1, lon), lineMat(i % 6 === 0 ? 0xdd7700 : 0x553300, i % 6 === 0 ? 0.6 : 0.1))); }
for (let i = 0; i < 4; i++) { const lon = (i / 4) * Math.PI * 2; for (let j = 0; j < 18; j++) { const t = (j / 17) * 2 - 1; const offset = t * 0.125; const fall = 1 - Math.abs(t) * 0.7; outerShell.add(new THREE.Line(meridian(R1, lon + offset, 200), lineMat(Math.abs(t) < 0.3 ? 0xffaa30 : 0xdd7700, 0.85 * fall))); } }
for (let j = 0; j < 20; j++) { const t = (j / 19) * 2 - 1; const offset = t * 0.175; const fall = 1 - Math.abs(t) * 0.65; outerShell.add(new THREE.Line(latRing(R1, offset, 200), lineMat(Math.abs(t) < 0.3 ? 0xffaa30 : 0xdd7700, 0.8 * fall))); }
orbGroup.add(outerShell);

const panelGroup = new THREE.Group();
for (let i = 0; i < 30; i++) {
  const lat = (Math.random() - 0.5) * Math.PI * 0.8, lon = Math.random() * Math.PI * 2, size = 0.15 + Math.random() * 0.25;
  const g = new THREE.Group();
  for (let di = 0; di <= 4; di++) { const lt = lat - size/2 + (di/4) * size; const pts = []; for (let dj = 0; dj <= 16; dj++) { const ln = lon - size/2 + (dj/16) * size; pts.push(new THREE.Vector3(R1 * Math.cos(lt) * Math.cos(ln), R1 * Math.sin(lt), R1 * Math.cos(lt) * Math.sin(ln))); } g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(0x884400, 0.25))); }
  for (let dj = 0; dj <= 4; dj++) { const ln = lon - size/2 + (dj/4) * size; const pts = []; for (let di = 0; di <= 16; di++) { const lt = lat - size/2 + (di/16) * size; pts.push(new THREE.Vector3(R1 * Math.cos(lt) * Math.cos(ln), R1 * Math.sin(lt), R1 * Math.cos(lt) * Math.sin(ln))); } g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(0x884400, 0.25))); }
  panelGroup.add(g);
}
orbGroup.add(panelGroup);

const innerCore = new THREE.Group();
const R3 = 0.9;
for (let s = 0; s < 8; s++) { const pts = []; for (let i = 0; i <= 300; i++) { const t = i / 300; const lat = t * Math.PI - Math.PI / 2; const lon = t * 4 * Math.PI + (s / 8) * Math.PI * 2; pts.push(new THREE.Vector3(R3 * Math.cos(lat) * Math.cos(lon), R3 * Math.sin(lat), R3 * Math.cos(lat) * Math.sin(lon))); } innerCore.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(0xffaa30, 0.4))); }
for (let i = -6; i <= 6; i++) { innerCore.add(new THREE.Line(latRing(R3, (i/6)*(Math.PI/2)*0.9, 80), lineMat(0x884400, 0.2))); }
for (let i = 0; i < 12; i++) { innerCore.add(new THREE.Line(meridian(R3, (i/12)*Math.PI*2, 80), lineMat(0x884400, 0.15))); }
orbGroup.add(innerCore);

const icoGeo = new THREE.IcosahedronGeometry(0.25, 1);
const icoWireMat = new THREE.LineBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
const icoWire = new THREE.LineSegments(new THREE.EdgesGeometry(icoGeo), icoWireMat);
orbGroup.add(icoWire);

const coreMat = new THREE.MeshBasicMaterial({ color: 0xffcc66, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), coreMat);
orbGroup.add(coreSphere);

const glowMat = new THREE.MeshBasicMaterial({ color: 0xdd7700, transparent: true, opacity: 0.04, blending: THREE.AdditiveBlending });
const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), glowMat);
orbGroup.add(glowSphere);

// Text
const codeTexts = ['sys.init()','0xFF3A','malloc()','>> SCAN','void*','ACK','SYNC OK','ptr_ref','exec()','hash256','::bind','core.0','01101001','>>> RDY','HEAP 4K','TCP/SYN','mutex.lk','IRQ 0x7','DMA xfer','REG EAX','kernel.d','pipe |>','chmod +x','fork()','SIGTERM','eth0: UP','AES-256','RSA 4096','TLS 1.3','HTTP/2','200 OK','fn main','use std','impl Orb','async {}','spawn()','.unwrap'];

function makeText(text, size = 0.08) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 32;
  const ctx = c.getContext('2d'); ctx.font = 'bold 14px Courier New';
  ctx.fillStyle = `rgba(255,${150+Math.random()*80|0},${30+Math.random()*30|0},${0.35+Math.random()*0.55})`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 128, 16);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size * 5, size * 0.7, 1); return s;
}

function scatterText(count, sizeFn, rFn) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const sp = makeText(codeTexts[Math.random() * codeTexts.length | 0], sizeFn());
    const phi = Math.acos(2 * Math.random() - 1), theta = Math.random() * Math.PI * 2, r = rFn();
    sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
    sp.userData = { phi, theta, r, speed: (0.0002 + Math.random() * 0.0008) * (Math.random() > 0.5 ? 1 : -1) };
    g.add(sp);
  }
  return g;
}

const textOuter = scatterText(800, () => 0.04 + Math.random() * 0.04, () => R1 + 0.05 + Math.random() * 0.08);
const textInner = scatterText(80, () => 0.03 + Math.random() * 0.03, () => R3 + 0.02);
const textAmbient = scatterText(300, () => 0.03, () => R3 + 0.3 + Math.random() * (R1 - R3 - 0.4));
orbGroup.add(textOuter, textInner, textAmbient);

// Debris
const debrisGeos = [new THREE.IcosahedronGeometry(0.012, 0), new THREE.IcosahedronGeometry(0.02, 0), new THREE.IcosahedronGeometry(0.03, 1), new THREE.TetrahedronGeometry(0.015, 0), new THREE.OctahedronGeometry(0.018, 0)];
const debris = [];
for (let i = 0; i < 200; i++) {
  const mesh = new THREE.Mesh(debrisGeos[Math.random() * debrisGeos.length | 0], new THREE.MeshBasicMaterial({ color: 0xffaa30, transparent: true, opacity: 0.3 + Math.random() * 0.6, blending: THREE.AdditiveBlending }));
  mesh.userData = { orbitR: 1.2 + Math.random() * 4, speed: (0.08 + Math.random() * 0.6) * (Math.random() > 0.5 ? 1 : -1), tiltX: (Math.random() - 0.5) * Math.PI * 0.9, tiltZ: (Math.random() - 0.5) * Math.PI * 0.5, phase: Math.random() * Math.PI * 2 };
  debris.push(mesh); orbGroup.add(mesh);
}

// Dust
const dustCount = 1500; const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) { const rr = 0.5 + Math.pow(Math.random(), 0.6) * 7; const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1); dustPos[i*3] = rr * Math.sin(phi) * Math.cos(theta); dustPos[i*3+1] = rr * Math.cos(phi); dustPos[i*3+2] = rr * Math.sin(phi) * Math.sin(theta); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
const dotC = document.createElement('canvas'); dotC.width = dotC.height = 64;
const dCtx = dotC.getContext('2d'); const gr = dCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
gr.addColorStop(0, 'rgba(255,170,48,1)'); gr.addColorStop(0.2, 'rgba(255,120,20,0.6)'); gr.addColorStop(0.5, 'rgba(200,80,0,0.15)'); gr.addColorStop(1, 'rgba(100,40,0,0)');
dCtx.fillStyle = gr; dCtx.fillRect(0, 0, 64, 64);
const dustMat = new THREE.PointsMaterial({ map: new THREE.CanvasTexture(dotC), size: 0.04, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, color: 0xffaa30 });
const dustPoints = new THREE.Points(dustGeo, dustMat);
orbGroup.add(dustPoints);

// Scan rings
const scanRing1 = new THREE.Mesh(new THREE.RingGeometry(1.99, 2.01, 120), new THREE.MeshBasicMaterial({ color: 0xffaa30, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
const scanRing2 = new THREE.Mesh(new THREE.RingGeometry(0.622, 0.638, 80), new THREE.MeshBasicMaterial({ color: 0xffaa30, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
scanRing1.rotation.x = Math.PI / 2; scanRing2.rotation.x = Math.PI / 2;
orbGroup.add(scanRing1, scanRing2);

// Animation
const clock = new THREE.Clock();
let flickerTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  outerShell.rotation.y += 0.0015;
  outerShell.rotation.x = Math.sin(t * 0.08) * 0.05;
  panelGroup.rotation.y += 0.0018;
  panelGroup.rotation.x = Math.sin(t * 0.08 + 0.5) * 0.04;
  innerCore.rotation.y -= 0.005;
  innerCore.rotation.z += 0.002;
  innerCore.rotation.x = Math.cos(t * 0.1) * 0.08;
  icoWire.rotation.x += 0.008;
  icoWire.rotation.y += 0.012;

  const surge = Math.pow(Math.max(0, Math.sin(t * 0.4)), 5) * 1.5 + Math.pow(Math.max(0, Math.sin(t * 0.7 + 2)), 8) * 2;
  coreSphere.scale.setScalar(1 + surge + Math.sin(t * 5) * 0.05);
  coreMat.opacity = Math.min(0.6, Math.max(0, (0.08 + Math.sin(t * 1.2) * 0.05 + surge * 0.2) * (1 - Math.pow(Math.max(0, Math.sin(t * 0.25)), 3) * 0.95)));
  glowSphere.scale.setScalar(1 + surge * 0.8);
  glowMat.opacity = Math.max(0, (0.03 + surge * 0.08));
  icoWire.scale.setScalar(1 + surge * 0.6);
  icoWire.material.opacity = Math.min(1, 0.5 + surge * 0.4);

  debris.forEach(d => { const u = d.userData; const a = t * u.speed + u.phase; d.position.set(u.orbitR * Math.cos(a) * Math.cos(u.tiltX), u.orbitR * Math.sin(u.tiltX) * Math.sin(a * 0.8) + Math.sin(a * 0.3 + u.tiltZ) * 0.2, u.orbitR * Math.sin(a) * Math.cos(u.tiltZ)); d.rotation.x += 0.015; d.rotation.z += 0.01; });

  [textOuter, textInner, textAmbient].forEach(group => group.children.forEach(sp => { const u = sp.userData; u.theta += u.speed; sp.position.set(u.r * Math.sin(u.phi) * Math.cos(u.theta), u.r * Math.cos(u.phi), u.r * Math.sin(u.phi) * Math.sin(u.theta)); }));

  const scanY1 = Math.sin(t * 0.4) * R1; scanRing1.position.y = scanY1; const s1 = Math.sqrt(Math.max(0, R1*R1 - scanY1*scanY1)) / R1; scanRing1.scale.set(s1, s1, 1); scanRing1.material.opacity = 0.2 * s1;
  const scanY2 = Math.sin(t * 0.6 + 2) * R3; scanRing2.position.y = scanY2; const s2 = Math.sqrt(Math.max(0, R3*R3 - scanY2*scanY2)) / R3; scanRing2.scale.set(s2, s2, 1); scanRing2.material.opacity = 0.15 * s2;

  dustPoints.rotation.y += 0.0002;

  flickerTimer += 0.016;
  if (flickerTimer > 0.1) { flickerTimer = 0; panelGroup.children.forEach(p => { if (Math.random() > 0.95) p.visible = !p.visible; }); }

  bloom.strength = 1.6 + Math.sin(t * 0.8) * 0.3;
  chromaticPass.uniforms.uTime.value = t;

  controls.update();
  composer.render();
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Expose for non-module scripts
window._scene = scene;
window._orbGroup = orbGroup;
window._recolorScene = recolorScene;
window._updateColors = updateColors;
console.log('ULTRON orb loaded');
</script>

<script>
// Color theming
document.querySelectorAll('.color-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    const color = dot.dataset.color;
    if (window._updateColors) window._updateColors(color);
  });
});

// Chat
let chatOpen = false;
function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chatPanel').classList.toggle('open', chatOpen);
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  const msgs = document.getElementById('chatMsgs');
  msgs.innerHTML += `<div class="m u">> ${q}</div>`;
  msgs.innerHTML += `<div class="m a">Processing...</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const d = await r.json();
    msgs.children[msgs.children.length - 1].remove();
    msgs.innerHTML += `<div class="m a">${d.answer || 'No response'}</div>`;
  } catch(e) {
    msgs.children[msgs.children.length - 1].remove();
    msgs.innerHTML += `<div class="m a">Backend offline. Run the Flask server.</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

// Camera / Hand tracking (MediaPipe)
let cameraActive = false;
let camStream = null;
let handLandmarker = null;
let isTracking = false;
let pinchState1 = null;  // { x, y } normalized
let pinchState2 = null;
let lastPinchDist = null;

async function initMediaPipe() {
  const vision = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm/'
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
      delegate: 'CPU',
    },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  return handLandmarker;
}

function detectHands(video, timestamp) {
  if (!handLandmarker || !cameraActive) return;
  const result = handLandmarker.detectForVideo(video, timestamp);
  const status = document.getElementById('camStatus');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 208, 156);

  const hands = result.landmarks || [];
  let p1 = null, p2 = null;

  for (let h = 0; h < hands.length; h++) {
    const lm = hands[h];
    if (!lm || lm.length < 21) continue;

    // Draw hand skeleton
    ctx.strokeStyle = '#ff8833';
    ctx.lineWidth = 1;
    const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
    for (const [a,b] of connections) {
      if (lm[a] && lm[b]) {
        ctx.beginPath();
        ctx.moveTo(lm[a].x * 208, lm[a].y * 156);
        ctx.lineTo(lm[b].x * 208, lm[b].y * 156);
        ctx.stroke();
      }
    }
    for (const p of lm) {
      ctx.fillStyle = '#ffaa30';
      ctx.beginPath();
      ctx.arc(p.x * 208, p.y * 156, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Detect pinch: thumb tip (4) close to index tip (8)
    const thumb = lm[4];
    const index = lm[8];
    if (thumb && index) {
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 0.07) {
        const x = (thumb.x + index.x) / 2;
        const y = (thumb.y + index.y) / 2;
        if (h === 0) p1 = { x, y };
        else p2 = { x, y };
      }
    }
  }

  if (p1) {
    status.textContent = `1 HAND · PINCH`;
    if (pinchState1) {
      const dx = p1.x - pinchState1.x;
      const dy = p1.y - pinchState1.y;
      if (Math.abs(dx) > 0.005 || Math.abs(dy) > 0.005) {
        if (window._controls) {
          window._controls.object.position.x -= dx * 8;
          window._controls.object.position.y += dy * 6;
          window._controls.object.lookAt(0, 0, 0);
        }
      }
    }
    pinchState1 = p1;
  } else {
    pinchState1 = null;
  }

  if (p2) {
    if (p1) {
      status.textContent = `2 HANDS · ZOOM`;
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      if (lastPinchDist && lastPinchDist > 0) {
        const factor = lastPinchDist / dist;
        if (Math.abs(factor - 1) > 0.02) {
          const pos = window._controls ? window._controls.object.position : null;
          if (pos) {
            const len = Math.hypot(pos.x, pos.y, pos.z);
            const newLen = Math.min(40, Math.max(0.6, len * factor));
            const scale = newLen / len;
            pos.x *= scale; pos.y *= scale; pos.z *= scale;
          }
        }
      }
      lastPinchDist = dist;
    }
    pinchState2 = p2;
  } else {
    pinchState2 = null;
    lastPinchDist = null;
  }

  if (!p1 && !p2) {
    status.textContent = 'SHOW HANDS';
  }

  if (isTracking) {
    requestAnimationFrame(() => detectHands(video, performance.now()));
  }
}

async function toggleCamera() {
  const preview = document.getElementById('cameraPreview');
  const btn = document.getElementById('camBtn');
  const video = document.getElementById('webcam');
  const status = document.getElementById('camStatus');

  if (cameraActive) {
    isTracking = false;
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    preview.style.display = 'none';
    btn.classList.remove('active');
    btn.textContent = 'CAMERA';
    cameraActive = false;
    status.textContent = 'CAMERA OFF';
    return;
  }

  try {
    if (!handLandmarker) await initMediaPipe();
    camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 208, height: 156, facingMode: 'user' } });
    video.srcObject = camStream;
    await video.play();
    preview.style.display = 'block';
    btn.classList.add('active');
    btn.textContent = 'CAM ON';
    cameraActive = true;
    isTracking = true;
    detectHands(video, performance.now());
  } catch(e) {
    status.textContent = 'CAMERA ERROR';
    console.error(e);
  }
}

// Fullscreen
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// Reset view
function resetView() {
  if (window._camera && window._controls) {
    window._camera.position.set(0, 0.5, 5.5);
    window._controls.target.set(0, 0, 0);
    window._camera.lookAt(0, 0, 0);
    window._controls.update();
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') toggleCamera();
  if (e.key === 'r' || e.key === 'R') resetView();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === '+' || e.key === '=') { if (window._controls) window._controls.dollyIn(1.4); }
  if (e.key === '-' || e.key === '_') { if (window._controls) window._controls.dollyOut(1.4); }
});
</script>
