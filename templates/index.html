<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON - AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="scanline"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="arc-reactor">
                    <div class="arc-ring"></div>
                    <div class="arc-core"></div>
                </div>
                <div class="logo-text">
                    <h1>ULTRON</h1>
                    <p class="subtitle">AI ASSISTANT // SYSTEM ONLINE</p>
                </div>
            </div>
            <div class="status-bar">
                <span class="status-dot online"></span>
                <span id="statusText">READY</span>
                <span class="sep">|</span>
                <span id="clockDisplay">--:--:--</span>
            </div>
        </header>

        <div class="add-section">
            <div class="section-header">
                <span class="section-icon">&#9670;</span>
                <h2>KNOWLEDGE ACQUISITION</h2>
            </div>
            <div class="add-form">
                <input type="text" id="videoUrl" placeholder="Enter YouTube URL..." />
                <input type="text" id="videoTitle" placeholder="Label (optional)" />
                <button onclick="addVideo()" class="btn-primary">INGEST</button>
            </div>
            <div id="addStatus" class="status"></div>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div class="section-header">
                    <span class="section-icon">&#9670;</span>
                    <h2>KNOWLEDGE BASE</h2>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Filter knowledge..." oninput="searchVideos()" />
                </div>
                <div id="videoList" class="video-list">
                    {% for video in videos %}
                    <div class="video-card" data-id="{{ video.video_id }}">
                        <div class="card-title">{{ video.title }}</div>
                        <div class="card-meta">{{ video.added_at[:10] }}</div>
                        <button class="btn-remove" onclick="event.stopPropagation(); removeVideo('{{ video.video_id }}')">DELETE</button>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="chat-section">
                <div class="section-header">
                    <span class="section-icon">&#9670;</span>
                    <h2>INTERFACE</h2>
                    <div class="header-actions">
                        <button onclick="resetChat()" class="btn-small" title="Reset conversation">RESET</button>
                    </div>
                </div>
                <div id="chatMessages" class="chat-messages">
                    <div class="message system">
                        <span class="msg-icon">&gt;&gt;</span>
                        ULTRON online. Ingest knowledge via YouTube URLs or ask me anything.
                    </div>
                </div>
                <div class="chat-input">
                    <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()" title="Voice input">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </button>
                    <input type="text" id="questionInput" placeholder="Type a message or use voice..." />
                    <button onclick="askUltron()" class="btn-primary">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const VIDEOS = {{ videos | tojson | safe }};
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
